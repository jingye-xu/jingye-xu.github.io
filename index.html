<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jingye's Profile</title>

  <!--
    - favicon
  -->
  <link rel="shortcut icon" href="./assets/images/logo.ico" type="image/x-icon">

  <!--
    - custom css link
  -->
  <link rel="stylesheet" href="./assets/css/style.css">

  <!--
    - google font link
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>

<body>

  <!--
    - #MAIN
  -->

  <main>

    <!--
      - #SIDEBAR
    -->

    <aside class="sidebar" data-sidebar>

      <div class="sidebar-info">

        <figure class="avatar-box">
          <img src="./assets/images/my-avatar.jpeg" alt="Jingye Xu" width="80">
        </figure>

        <div class="info-content">
          <h1 class="name" title="Jingye Xu">Jingye Xu</h1>

          <p class="title">PhD Candidate at UTSA</p>
        </div>

        <button class="info_more-btn" data-sidebar-btn>
          <span>Show Contacts</span>

          <ion-icon name="chevron-down"></ion-icon>
        </button>

      </div>

      <div class="sidebar-info_more">

        <div class="separator"></div>

        <ul class="contacts-list">

          <li class="contact-item">

            <div class="icon-box">
              <ion-icon name="mail-outline"></ion-icon>
            </div>

            <div class="contact-info">
              <p class="contact-title">Email</p>

              <p class="contact-link">jingye.xu[at]outlook.com</p>
            </div>

          </li>

          <li class="contact-item">

            <div class="icon-box">
              <ion-icon name="location-outline"></ion-icon>
            </div>

            <div class="contact-info">
              <p class="contact-title">Location</p>

              <address>Cypress, TX, USA</address>
            </div>

          </li>

        </ul>

        <div class="separator"></div>
        
      </div>

    </aside>

    <!--
      - #main-content
    -->

    <div class="main-content">



      <!--
        - #NAVBAR
      -->
      <nav class="navbar">

        <ul class="navbar-list">

          <li class="navbar-item">
            <button class="navbar-link  active" data-nav-link>About</button>
          </li>

          <li class="navbar-item">
            <button class="navbar-link" data-nav-link>Portfolio</button>
          </li>

          <!-- <li class="navbar-item">
            <button class="navbar-link" data-nav-link>Blogs</button>
          </li> -->

        </ul>

      </nav>


      <!--
        - #ABOUT
      -->

      <article class="about  active" data-page="about">

        <header>
          <h2 class="h2 article-title">About me</h2>
        </header>

        <section class="about-text">
          <div id="about-text-container">
            <!-- Content will be loaded from aboutme.txt -->
          </div>

          <script>
          // Load about me text from file
          fetch('assets/contents/aboutme.txt')
            .then(response => response.text())
            .then(text => {
              const container = document.getElementById('about-text-container');
              // Split text by double newlines and create paragraphs
              const paragraphs = text.split('\n\n');
              paragraphs.forEach(paragraph => {
                if (paragraph.trim()) {
                  const p = document.createElement('p');
                  p.textContent = paragraph.trim();
                  container.appendChild(p);
                }
              });
            })
            .catch(error => console.error('Error loading about me text:', error));
          </script>
        </section>

        <section class="timeline">

          <div class="title-wrapper">
            <div class="icon-box">
              <ion-icon name="book-outline"></ion-icon>
            </div>
            <h3 class="h3">Education</h3>
          </div>

          <ol class="timeline-list" id="education-timeline">
            <!-- Education items will be loaded here -->
          </ol>

          <script>
            // Load education timeline from file
            fetch('assets/contents/education.txt')
              .then(response => response.text())
              .then(text => {
                const timeline = document.getElementById('education-timeline');
                // Each entry is separated by double newlines
                const entries = text.split('\n\n');
                entries.forEach(entry => {
                  const lines = entry.trim().split('\n');
                    if (lines.length >= 4) {
                    const [school, major, time, ...descArr] = lines;
                    const desc = descArr.map(line => `&nbsp;&nbsp;${line.trim()}`).join('<br>');
                    const li = document.createElement('li');
                    li.className = 'timeline-item';
                    li.innerHTML = `
                      <h4 class="h4 timeline-item-title">${school}</h4>
                      <span class="timeline-major">${major}</span>
                      <span class="timeline-time">${time}</span>
                      <p class="timeline-text">${desc}</p>
                    `;
                    timeline.appendChild(li);
                    }
                });
              })
              .catch(error => console.error('Error loading education timeline:', error));
          </script>

        </section>

        <section class="timeline">

          <div class="title-wrapper">
            <div class="icon-box">
              <ion-icon name="book-outline"></ion-icon>
            </div>
            <h3 class="h3">Experience</h3>
          </div>

          <ol class="timeline-list" id="experience-timeline">
            <!-- Experience items will be loaded here -->
          </ol>

          <script>
            // Load experience timeline from file
            fetch('assets/contents/experience.txt')
              .then(response => response.text())
              .then(text => {
                const timeline = document.getElementById('experience-timeline');
                // Each entry is separated by double newlines
                const entries = text.split('\n\n');
                entries.forEach(entry => {
                  const lines = entry.trim().split('\n');
                    if (lines.length >= 4) {
                    const [company, position, time, ...descArr] = lines;
                    const desc = descArr.map(line => `&nbsp;&nbsp;${line.trim()}`).join('<br>');
                    const li = document.createElement('li');
                    li.className = 'timeline-item';
                    li.innerHTML = `
                      <h4 class="h4 timeline-item-title">${company}</h4>
                      <span class="timeline-major">${position}</span>
                      <span class="timeline-time">${time}</span>
                      <p class="timeline-text">${desc}</p>
                    `;
                    timeline.appendChild(li);
                    }
                });
              })
              .catch(error => console.error('Error loading experience timeline:', error));
          </script>

        </section>
      </article>


      <!--
        - #PORTFOLIO
      -->

      <article class="portfolio" data-page="portfolio">

        <header>
          <h2 class="h2 article-title">Portfolio</h2>
        </header>

        <section class="projects">

          <ul class="filter-list">

            <li class="filter-item">
              <button class="active" data-filter-btn>All</button>
            </li>

            <li class="filter-item">
              <button data-filter-btn>Researches</button>
            </li>

            <li class="filter-item">
              <button data-filter-btn>Applications</button>
            </li>

          </ul>

          <div class="filter-select-box">

            <button class="filter-select" data-select>

              <div class="select-value" data-selecct-value>Select category</div>

              <div class="select-icon">
                <ion-icon name="chevron-down"></ion-icon>
              </div>

            </button>

            <ul class="select-list">

              <li class="select-item">
                <button data-select-item>All</button>
              </li>

              <li class="select-item">
                <button data-select-item>Researches</button>
              </li>

              <li class="select-item">
                <button data-select-item>Applications</button>
              </li>

            </ul>

          </div>

          <ul class="project-list" id="project-list">
            <!-- Portfolio items are loaded from assets/contents/projects/projects.json -->
          </ul>

        </section>
      </article>


    </div>
  </main>

  <div class="modal-container" data-modal-container>

    <div class="overlay" data-overlay></div>

    <section class="testimonials-modal">

      <button class="modal-close-btn" data-modal-close-btn>
        <ion-icon name="close-outline"></ion-icon>
      </button>

      <div class="modal-content">
        <h4 class="h3 modal-title" data-modal-title>Project Article</h4>
        <div data-project-article></div>
      </div>

    </section>

  </div>




  <!--
    - custom js link
  -->
  <script src="./assets/js/script.js"></script>

  <!--
    - ionicon link
  -->
  <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>

</body>

</html>
